[package]
name = "baiduyun_api"
license = "MIT"
authors = ["flyer <2350827470@qq.com>"]
description = "百度网盘开放平台 Rust 封装:纯同步(ureq),零 async 运行时依赖,读写/搜索/上传一库搞定"
version = "0.3.1"
# MSRV 1.85:2026 依赖生态水位(ureq 3.4/zeroize 1.9 的 edition2024 均需 1.85);
# 生态水位上升时随政策评估抬升(CI msrv job 守护)
rust-version = "1.85"
repository = "https://github.com/hfh1999/baiduyun_api"
edition = "2021"
keywords = ["baiduyun", "baidu", "netdisk", "baidupan", "pcs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# 低频大流量测试(369MB 真实下载,验证传输 agent 超时语义)——默认不编译,
# 常规 --ignored 全量回归不会执行;显式开启才编译运行:
#   cargo test --features large-tests --lib --test-threads=1 test_download_large
large-tests = []

[dependencies]
# ureq 精确锁 =3.4.0:multipart 位于 unversioned 区(官方不承诺 semver),是 2GB 上传
# known-size 的唯一通道(实测 2026-09:手写 multipart 只能 chunked,200MB 被百度连接重置;
# ureq 发送层无 known-size 流式公开接口)。影响面:3.4.0 当前为最新版,冲突面≈0。
# 升级触发器:ureq 发布新版 / 用户报告版本冲突——届时评估 ~3.4 或升级(须过 24 个网络测试)
ureq = { version = "=3.4.0", features = ["multipart"] }
serde_json = "1.0.64"
serde = {version = "1.0.193", features = ["derive"]}
serde_urlencoded = "0.7.1"
